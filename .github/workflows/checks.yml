name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install GTK and virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-3.0 xvfb
      - name: Create system Python environment
        run: |
          uv venv --python /usr/bin/python3 --system-site-packages
          uv sync --locked
      - name: Run offline tests
        run: uv run python -m unittest discover -s tests -v
      - name: Render widget with synthetic data
        run: xvfb-run -a uv run python tools/preview.py /tmp/widget.png
